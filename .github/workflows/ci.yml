name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: install, baseline, lint, typecheck, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: database/ matches the supplied baseline byte-for-byte
        run: pnpm check:db-baseline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Fail on high or critical advisories
        run: pnpm audit --audit-level high

  compose-and-health:
    name: docker compose up + /health on every service
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: docker compose up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start services and check /health
        run: |
          cp .env.example .env
          (cd apps/api && node --env-file=../../.env dist/main.js &) 
          (cd apps/ingest && node --env-file=../../.env dist/main.js &)
          (cd apps/worker && node --env-file=../../.env dist/main.js &)
          (cd apps/console && pnpm start &)
          for port in 4000 4100 4200 3000; do
            for i in $(seq 1 30); do curl -fsS "http://localhost:$port/health" && break; sleep 2; done
            echo
            curl -fsS "http://localhost:$port/health" | grep -q '"status":"ok"' || { echo "health failed on $port"; exit 1; }
          done
      - if: always()
        run: docker compose down -v
